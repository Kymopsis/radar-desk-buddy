name: Something does not work
description: Wiring, flashing, radar, Wi-Fi or Telegram problem
labels: [bug]
body:
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - "1: desk pet"
        - "2: Telegram"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: ESP32 board, radar kit, screen, servos (and where you bought them)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version or commit
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Serial log
      description: From `idf.py monitor`. Remove your Wi-Fi password and Telegram token before posting.
      render: text
